name: Build APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9

      - name: Build debug APK
        run: gradle assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: LinkIt-APK
          path: app/build/outputs/apk/debug/*.apk
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          APK=$(find . -name "*.apk" -not -path "*/intermediates/*" | head -1)
          echo "Found: $APK"
          cp "$APK" linkit.apk
          gh release create "v${{ github.run_number }}" linkit.apk --title "גרסה ${{ github.run_number }}" --notes "APK להתקנה"
