plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lnk.shortcuts'
    compileSdk 34

    defaultConfig {
        applicationId "com.lnk.shortcuts"
        minSdk 26
        targetSdk 34
        versionCode 3
        versionName "2.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    lint {
        abortOnError false
    }
}

dependencies {
    // נדרש רק עבור FileProvider (שיתוף ופתיחת קבצים)
    implementation 'androidx.core:core:1.13.1'
}
