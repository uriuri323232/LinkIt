plugins {
    id 'com.android.application'
}

android {
    namespace 'com.lnk.shortcuts'
    compileSdk 34

    defaultConfig {
        applicationId "com.lnk.shortcuts"
        minSdk 26
        targetSdk 34
        versionCode 5
        versionName "4.0"
    }

    // כל קוד האפליקציה נמצא בתיקייה src/linkit.
    // קבצים ישנים שנשארו ב-src/main (מגרסאות קודמות) מתעלמים מהם לגמרי, ולכן לא שוברים את הבנייה.
    sourceSets {
        main {
            manifest.srcFile 'src/linkit/AndroidManifest.xml'
            java.srcDirs = ['src/linkit/java']
            res.srcDirs = ['src/linkit/res']
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
